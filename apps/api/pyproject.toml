[project]
name = "cramrag"
version = "0.1.0"
description = "Study assistant over course material: retrieval, answers, flashcards, and quizzes."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live, migrated database"]
# Integration tests are skipped by default so `pytest` passes on a machine with
# Docker stopped. Run them with: pytest -m integration
addopts = "-m 'not integration'"

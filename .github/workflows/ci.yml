name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cramrag
          POSTGRES_PASSWORD: cramrag
          POSTGRES_DB: cramrag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cramrag -d cramrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credentials for a throwaway container that exists for one job.
      # There is no .env in CI, so settings come from the real environment.
      DATABASE_URL: postgresql://cramrag:cramrag@localhost:5433/cramrag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install
        run: pip install -e apps/api -r apps/api/requirements-dev.txt

      - name: Migrate from an empty database
        working-directory: apps/api
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        working-directory: apps/api
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Unit tests
        working-directory: apps/api
        run: pytest

      - name: Integration tests
        working-directory: apps/api
        run: pytest -m integration

      - name: Smoke test the running API
        working-directory: apps/api
        run: |
          uvicorn cramrag.main:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health/live >/dev/null; do sleep 0.5; done'
          curl -sf http://127.0.0.1:8000/health/ready | tee ready.json
          # Readiness already asserts the database, extensions, and migrations,
          # so one grep covers the whole stack.
          grep -q '"status":"ok"' ready.json

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
